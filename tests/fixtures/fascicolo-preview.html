<!doctype html>
<!-- Banco di prova visivo della sidebar: monta renderer/sidebar.js con sessioni
     finte, fuori da Electron. Serve a guardare il fascicolo (linguetta, pannello,
     fogli) senza avviare l'app. Vive in tests/fixtures/ per non finire nel pacchetto. -->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Fascicolo — banco di prova</title>
<link rel="stylesheet" href="../../renderer/styles.css">
<style>
  body { margin: 0; display: flex; height: 100vh; }
  #sidebar { padding-top: 16px; }
</style>
</head>
<body>
<div id="sidebar">
  <div class="side-section">Sessioni <span id="count"></span></div>
  <div id="session-list"></div>
</div>
<div style="flex:1"></div>
<script src="../../renderer/agent-icons.js"></script>
<script src="../../renderer/pizza-slice.js"></script>
<script src="../../renderer/session-groups.js"></script>
<script src="../../renderer/sidebar.js"></script>
<script src="../../renderer/confirm-bubble.js"></script>
<script>
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
  const sessions = [
    { id: '1', type: 'claude', name: 'refactor sidebar', cwd: '/home/ale/digitiamo/aisessionmanager', projectRoot: '/home/ale/digitiamo/aisessionmanager', alive: true, claudeAccountName: 'OAuth' },
    { id: '2', type: 'claude', name: 'fix release', cwd: '/home/ale/digitiamo/aisessionmanager/app', projectRoot: '/home/ale/digitiamo/aisessionmanager', alive: true },
    { id: '3', type: 'claude', name: 'usage bar', cwd: '/home/ale/digitiamo/aisessionmanager', projectRoot: '/home/ale/digitiamo/aisessionmanager', alive: false, needsAttention: true },
    { id: '4', type: 'shell', name: 'build', cwd: '/home/ale/digitiamo/segnaPOS', projectRoot: '/home/ale/digitiamo/segnaPOS', alive: true },
    { id: '5', type: 'codex', name: 'missing ope', cwd: '/home/ale/digitiamo/segnaPOS/src', projectRoot: '/home/ale/digitiamo/segnaPOS', alive: true },
    { id: '6', type: 'opencode', name: 'prova lunga con un nome che non ci sta', cwd: '/tmp', projectRoot: null, alive: true },
  ];
  const query = new URLSearchParams(location.search);
  // ?attention=3,5 — accende il lampeggio su quelle sessioni, per guardare che
  // la tinta sia quella del loro tipo
  for (const id of (query.get('attention') || '').split(',').filter(Boolean)) {
    const s = sessions.find((x) => x.id === id);
    if (s) s.needsAttention = true;
  }
  // ?running=1,4 — sessioni "al lavoro": barra del tipo animata
  for (const id of (query.get('running') || '').split(',').filter(Boolean)) {
    const s = sessions.find((x) => x.id === id);
    if (s) s.running = true;
  }
  // ?collapsed=claude,shell — per guardare il fascicolo chiuso
  const collapsed = (query.get('collapsed') || '').split(',').filter(Boolean);
  localStorage.setItem('aisess.collapsedGroups', JSON.stringify(collapsed));
  localStorage.setItem('aisess.collapsedProjects', JSON.stringify(collapsed));
  const sidebar = window.AisessSidebar.createSidebar({
    list: document.getElementById('session-list'),
    count: document.getElementById('count'),
    storage: localStorage,
    Icons: window.AisessIcons,
    Slice: window.PizzaSlice,
    Groups: window.AisessGroups,
    escapeHtml,
    onSelect: (id) => sidebar.render(sessions, id),
    // La ✕ chiede conferma con un fumetto appoggiato alla card: qui la domanda
    // si può guardare, la risposta non chiude niente.
    onClose: (id, anchor) => {
      const t = sessions.find((s) => s.id === id);
      bubble.ask({ anchor, key: id, name: t.name, detachable: true });
    },
    onRename: () => {},
    onNewInProject: () => {},
  });
  const bubble = window.AisessConfirmBubble.createConfirmBubble();
  sidebar.setMode(query.get('mode') === 'project' ? 'project' : 'type');
  sidebar.render(sessions, '2');
  // Per la foto: le animazioni ferme su un istante scelto. Uno screenshot le
  // becca sempre al fotogramma zero (headless non le fa scorrere), dove il
  // lampeggio è trasparente e la luce della barra è fuori dalla card.
  // ?phase=<secondi> sceglie l'istante (-1.2 = colmo del lampeggio).
  if (query.has('attention') || query.has('running')) {
    const ph = query.get('phase') || '-1.2';
    const s = document.createElement('style');
    // I selettori ricalcano quelli di styles.css: `animation` è una scorciatoia
    // e rimette il delay a 0, quindi una regola meno specifica non congela
    // niente (la foto uscirebbe sempre al fotogramma zero).
    s.textContent = `.session-item.needs-attention, .group-header.needs-attention,
      .session-item.is-running::before {
      animation-delay: ${ph}s !important; animation-play-state: paused !important; }`;
    document.head.appendChild(s);
  }
  // ?confirm=<id> — apre il fumetto senza click, per la foto
  const auto = query.get('confirm');
  if (auto) {
    const card = document.querySelector(`.session-item[data-id="${auto}"]`);
    const t = sessions.find((s) => s.id === auto);
    if (card) bubble.ask({ anchor: card, key: auto, name: t.name, detachable: true });
  }
</script>
</body>
</html>
