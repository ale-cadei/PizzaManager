# Configurazione tmux di AISessionManager.
#
# Viene passata con `tmux -L aisession -f <questo file>`: il socket dedicato
# da' all'app un server tutto suo, cosi' questa configurazione non si mescola
# con il ~/.tmux.conf personale dell'utente e viceversa.
#
# Obiettivo: tmux deve essere invisibile. L'utente vede il suo terminale,
# non tmux.

# Nessun prefisso: Ctrl+B (e tutto il resto) arriva all'applicazione ospitata.
set -g prefix None
unbind C-b

# Colori pieni: le TUI di claude/opencode/codex li usano.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Niente alternate screen verso il terminale che ci ospita (xterm.js): smcup@ e
# rmcup@ cancellano quelle due capacita'. Dentro l'alternate screen xterm non ha
# scrollback, e traduce la rotella in frecce su/giu' — nella shell si sfogliano
# i comandi recenti invece del testo. Senza, l'output resta nella schermata
# normale: la history la tiene xterm, che e' anche chi fa la selezione col
# mouse (vedi `mouse off` piu' sotto: i due pezzi vanno insieme).
# Vale solo per il terminale esterno; l'alternate screen delle applicazioni
# dentro tmux (vim, le TUI degli agenti) non si tocca.
set -ga terminal-overrides ',*:smcup@:rmcup@'

# Esc immediato: altrimenti le TUI vedono Esc con mezzo secondo di ritardo.
set -g escape-time 0

# Scrollback generoso: e' il motivo per cui si riattacca invece di ricominciare.
set -g history-limit 50000

# Niente barra di stato: tmux deve restare invisibile.
set -g status off

# Mouse a chi sta sopra, non a tmux. Con `mouse on` tmux cattura il drag: entra
# nella sua copy-mode, e al rilascio la chiude portandosi via la selezione —
# l'utente vede il testo evidenziarsi e sparire, e xterm non ne ha mai vista
# una da dare a Ctrl+Shift+C (la copia dell'app legge `term.getSelection()`).
# Con `off` il drag resta a xterm.js, mentre le TUI che chiedono il mouse
# (claude, codex, opencode) continuano a riceverlo: tmux inoltra le sequenze
# dell'applicazione al terminale esterno comunque.
set -g mouse off

# La finestra segue le dimensioni del client piu' recente: con un solo client
# per sessione (il caso dell'app) e' l'unico comportamento sensato.
set -g window-size latest

# Una sessione senza client resta viva: e' tutto il punto. Il server invece
# puo' spegnersi quando non ha piu' sessioni (exit-empty al default): senza
# sessioni non c'e' niente da preservare, e resterebbe un processo a vuoto.
set -g destroy-unattached off

# Rotella e barra laterale dell'app scorrono la history di tmux con la
# copy-mode (lib/tmux.js), che in alto a destra mostra [riga/history]. Di
# default e' giallo pieno: qui prende i colori dell'app (--action-soft e
# --action-text di renderer/tokens.css).
set -g mode-style 'fg=#FF9B6F,bg=#2B120A'
