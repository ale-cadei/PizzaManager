# Configurazione psmux di PizzaManager, su Windows (docs/plans/52-psmux-backend.md).
#
# psmux capisce i comandi di tmux, ma non e' tmux: alcune opzioni di
# app/tmux.conf qui vanno al contrario, e ognuna di queste righe viene da una
# misura (docs/plans/40-risultati.md). Passata con `-L aisession -f <questo file>`
# come quella di tmux.

# Nessun prefisso vero. psmux scarta `prefix None` in silenzio e resta su C-b
# (Q4): Ctrl+B poi `c` aprirebbe una seconda finestra. Una combinazione che
# nessuno preme lascia arrivare Ctrl+B all'applicazione.
set -g prefix C-M-S-F12
unbind C-b

# Colori pieni. Niente terminal-features (psmux da' un avviso) ne'
# terminal-overrides (ignorato: il client entra sempre nello schermo
# alternativo e cattura sempre il mouse, e' scritto nel codice).
set -g default-terminal "tmux-256color"

# Esc immediato: altrimenti le TUI vedono Esc con mezzo secondo di ritardo.
set -g escape-time 0

# Scrollback generoso: e' il motivo per cui si riattacca invece di ricominciare.
set -g history-limit 50000

# Niente barra di stato. Il client psmux tiene comunque una riga per lei
# (Q4, «una riga in meno»): l'ultima riga del terminale resta vuota.
set -g status off

# Mouse a psmux, al contrario di Mac. Con `off` il server psmux scarta gli
# eventi di mouse diretti al pane, e Claude non seleziona piu'. Con `on` Claude
# e le TUI ricevono il mouse, nelle shell seleziona psmux, e la rotella scorre
# la sua history («Il mouse» in 40-risultati.md).
set -g mouse on

# Il server "caldo" di psmux si riusa solo per sessioni senza config, comando,
# cartella, -e e dimensioni: l'app passa sempre tutti e cinque, quindi sarebbe
# solo un processo in piu'.
set -g warm off

# La finestra segue le dimensioni del client piu' recente (un client per sessione).
set -g window-size latest

# Una sessione senza client resta viva: e' tutto il punto.
set -g destroy-unattached off

# I colori della copy-mode, come in tmux.conf (--action-soft e --action-text
# di renderer/tokens.css).
set -g mode-style 'fg=#FF9B6F,bg=#2B120A'
