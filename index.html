<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AISessionManager</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <div class="brand-name">AISessionManager</div>
        <div class="brand-sub" id="platform-label">linux</div>
      </div>
    </div>
    <div class="side-actions">
      <button class="btn primary" id="btn-resume" title="Riprendi una vecchia sessione">⟲ Resume</button>
    </div>
    <div class="side-section">NUOVA SESSIONE</div>
    <div class="new-grid">
      <button class="btn new-btn" data-new="shell" title="Terminale semplice">🖥 Terminale</button>
      <button class="btn new-btn" data-new="opencode" title="Nuova sessione OpenCode">⚡ OpenCode</button>
      <button class="btn new-btn" data-new="claude" title="Nuova sessione Claude Code">🤖 Claude</button>
    </div>
    <div class="side-section">SESSIONI APERTE <span id="count"></span></div>
    <div id="session-list"></div>
    <div class="side-footer">
      <span class="legend"><i class="dot shell"></i>shell</span>
      <span class="legend" id="dep-opencode" title="stato binario opencode"><i class="dot opencode"></i>opencode</span>
      <span class="legend" id="dep-claude" title="stato binario claude"><i class="dot claude"></i>claude</span>
    </div>
    <div class="side-footer muted" id="deps-status" style="font-size:11px"></div>
  </aside>
  <div id="sidebar-resizer" title="Trascina per ridimensionare la sidebar (doppio clic per ripristinare)"></div>
  <main id="main">
    <div id="empty">
      <p class="muted">Nessuna sessione aperta — usa la sidebar a sinistra per avviarne una o fare resume.</p>
    </div>
    <div id="terminals"></div>
  </main>
</div>

<!-- Modal nuova sessione -->
<div class="modal-backdrop" id="modal-new" hidden>
  <div class="modal">
    <h2>Nuova sessione</h2>
    <div class="type-cards">
      <button class="type-card selected" data-type="shell">🖥<b>Terminale</b><span>shell semplice</span></button>
      <button class="type-card" data-type="opencode">⚡<b>OpenCode</b><span>opencode TUI</span></button>
      <button class="type-card" data-type="claude">🤖<b>Claude</b><span>claude TUI</span></button>
    </div>
    <label>Nome (opzionale)<input id="new-name" placeholder="es. backend, fix-auth…" /></label>
    <label>Directory di lavoro
      <div class="row">
        <input id="new-cwd" placeholder="/home/utente/progetto" />
        <button class="btn" id="btn-browse">Sfoglia…</button>
      </div>
    </label>
    <div class="modal-actions">
      <button class="btn" id="new-cancel">Annulla</button>
      <button class="btn primary" id="new-confirm">Avvia</button>
    </div>
  </div>
</div>

<!-- Modal resume -->
<div class="modal-backdrop" id="modal-resume" hidden>
  <div class="modal wide">
    <h2>⟲ Resume di una sessione precedente</h2>
    <div class="tabs">
      <button class="tab active" data-tab="opencode">⚡ OpenCode</button>
      <button class="tab" data-tab="claude">🤖 Claude Code</button>
      <button class="tab" data-tab="history">🕘 Cronologia app</button>
    </div>
    <input id="resume-search" placeholder="Cerca per titolo, directory o id…" />
    <div id="resume-list"><p class="muted">Caricamento…</p></div>
    <div class="modal-actions">
      <button class="btn" id="resume-close">Chiudi</button>
      <button class="btn" id="resume-reload">↻ Ricarica</button>
    </div>
  </div>
</div>

<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
<script src="renderer.js"></script>
</body>
</html>
