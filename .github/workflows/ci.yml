# Test a ogni push e PR. I casi Windows girano anche da Unix con
# `platform: 'win32'` iniettato (tests/windows.test.js), ma solo un host
# Windows vede i test che presumono Unix senza dirlo, e prova davvero
# cmd.exe, i .cmd e node-pty (docs/plans/24-windows-prova-vera.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    # Un test che lascia un processo appeso teneva il job vivo 6 ore (il
    # massimo di GitHub): la suite intera ci mette pochi minuti.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Su Windows i test d'integrazione di tmux girano contro psmux, quello
      # del pacchetto (docs/plans/52): senza, si dichiarano saltati.
      - if: runner.os == 'Windows'
        run: npm run fetch:psmux
      # DIAGNOSI (branch usa e getta): ogni file da solo, chi non esce in 90 s.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          node --version
          for f in tests/*.test.js; do
            s=$(date +%s); timeout 90 node --test "$f" > out.txt 2>&1; rc=$?
            echo "rc=$rc $(( $(date +%s) - s ))s $f"
            if [ $rc -eq 124 ]; then echo "----- $f (ultime righe)"; tail -25 out.txt; echo "-----"; fi
          done
      - if: runner.os != 'Windows'
        run: npm run test:unit
