# Test a ogni push e PR. Ubuntu basta: i casi Windows girano da Unix con
# `platform: 'win32'` iniettato (tests/windows.test.js).
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
