# Pacchetti a ogni tag `v*`: un runner per sistema, perché node-pty è un
# modulo nativo che si compila per piattaforma (niente cross-build).
# electron-builder carica i file su una GitHub Release con lo stesso nome del
# tag, creata in bozza se non esiste: si pubblica a mano dopo un'occhiata.
#
# Non firmati: su macOS chi scarica deve autorizzare l'app in Impostazioni →
# Privacy e sicurezza (o `xattr -cr`); su Windows compare l'avviso SmartScreen.
# Firmare richiede Apple Developer Program / un certificato code-signing:
# quando ci saranno, electron-builder li usa da variabili d'ambiente.
name: release
on:
  push:
    tags: ['v*']
  # Rilancio a mano da un branch (gh workflow run release.yml --ref <branch>):
  # carica sulla bozza di Release della versione in package.json.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # La bozza di Release nasce QUI, prima dei build. electron-builder fa
  # "trova la bozza, altrimenti creala" senza alcun lock: quattro job che
  # finiscono insieme creavano quattro bozze con lo stesso tag (successo con
  # v1.0.2, unite a mano). Con la bozza gia' esistente, tutti la trovano.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes "" --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # Due job per macOS: x64 e' una cross-compilazione di node-pty sul
          # runner arm64, e un suo problema non deve bloccare il .dmg arm64.
          - os: macos-latest
            args: --mac --arm64
          - os: macos-latest
            args: --mac --x64
          - os: ubuntu-latest
            args: --linux
          # windows-latest e' passato a Visual Studio 2026, che node-gyp non
          # riconosce ancora: node-pty non si compilerebbe.
          - os: windows-2022
            args: --win
    runs-on: ${{ matrix.os }}
    # Un build che non finisce deve fallire, non occupare un runner per ore
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Niente test qui: girano gia' in ci.yml su ogni push e PR, e il tag parte
      # da un main verificato. Sul runner Windows la suite (scritta per Unix:
      # permessi, path POSIX) fallirebbe per motivi che non riguardano il build.
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder
          # Senza certificato electron-builder firma ad hoc e va avanti
          CSC_IDENTITY_AUTO_DISCOVERY: false
